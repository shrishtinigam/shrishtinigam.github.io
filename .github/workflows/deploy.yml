name: Build and deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Checkout Pelican generator
        run: git clone --depth 1 --branch feature/markdown-ssg https://github.com/shrishtinigam/github-pages-ssg.git .ssg

      - name: Install Pelican generator
        run: python -m pip install -r .ssg/requirements.txt

      - name: Validate Markdown
        working-directory: .ssg
        run: make check

      - name: Build site
        working-directory: .ssg
        run: python -m pelican content -s publishconf.py -o ../output -t theme --fatal warnings

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
