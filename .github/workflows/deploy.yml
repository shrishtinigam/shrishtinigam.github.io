name: Build and deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout canonical Pelican source
        uses: actions/checkout@v4
        with:
          repository: shrishtinigam/github-pages-ssg
          ref: main
          path: .ssg
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            .ssg/requirements.txt
            .ssg/constraints.txt
            .ssg/pyproject.toml

      - name: Install Pelican generator
        working-directory: .ssg
        run: python -m pip install -r requirements.txt

      - name: Validate Markdown
        working-directory: .ssg
        run: spg check

      - name: Build site
        working-directory: .ssg
        run: spg build --output ../output

      - name: Test generator before publishing
        working-directory: .ssg
        run: python -m unittest discover -s tests -v

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
