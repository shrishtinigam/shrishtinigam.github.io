[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-sitegen"
version = "0.1.0"
description = "Markdown-powered static site generator for shrishtinigam.github.io"
requires-python = ">=3.11"
dependencies = [
    "Jinja2>=3.1,<4",
    "Markdown>=3.7,<4",
    "python-frontmatter>=1.0,<1.1",
]

[project.scripts]
sitegen = "sitegen.cli:main"

[tool.setuptools.packages.find]
include = ["sitegen*"]
